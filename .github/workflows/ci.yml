name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve frozen replay fixtures
        env:
          FIXTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-frozen-fixtures.sh "$FIXTURE_BASE"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build site and check docs links
        run: bun run --filter digipology-site build
